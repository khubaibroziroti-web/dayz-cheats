# Static Astro site served from Cloudflare Workers Assets.
name = "getrustcheat-com"
compatibility_date = "2026-10-23"
main = "src/worker.ts"

[[routes]]
pattern = "getrustcheat.com"
custom_domain = true

[[routes]]
pattern = "www.getrustcheat.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
